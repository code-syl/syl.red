# /etc/nginx/snippets/syl.red-common.conf
# Shared by every syl.red HTTPS server block. Include it inside `server { }`.

# ---------- TLS (Mozilla "modern") ----------
ssl_certificate     /etc/nginx/ssl/origin-certificate.pem;
ssl_certificate_key /etc/nginx/ssl/syl.red-private-key.key;
ssl_protocols TLSv1.3;
ssl_ecdh_curve X25519:prime256v1:secp384r1;
ssl_prefer_server_ciphers off;
# No ssl_ciphers line: it only affects TLS 1.2 and older, which are disabled.

# ---------- Locations ----------
# Block dotfiles except .well-known.
# Must stay ABOVE the PHP block: regex locations are tried in order and the
# first match wins, so otherwise /.secret/x.php would go to php-fpm.
location ~ /\.(?!well-known) {
	# help i am a teapot /d-face
	return 418;
}

location / {
	try_files $uri $uri/ /index.php$is_args$args;
}

# Send php files to php-fpm (404 if the script doesn't actually exist)
location ~ \.php$ {
	try_files $uri =404;
	# Generic socket managed by update-alternatives: follows the default PHP
	# version, so PHP upgrades need no nginx change.
	fastcgi_pass unix:/run/php/php-fpm.sock;
	include fastcgi.conf;
}

# ---------- Security headers ----------
# `always` = also send them on error responses (404, 418, 5xx...).
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "same-origin" always;

# unsafe-inline for style-src-attr is an acceptable risk for my hobby website.
# I do not allow any user or third-party content.
add_header Content-Security-Policy "default-src 'self'; style-src 'self'; style-src-attr 'unsafe-inline'; script-src 'self'; img-src 'self' data: blob:; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests;" always;

# Ultimate AI Block List v1.7 20250924
include /etc/nginx/snippets/ai-block-list.conf;

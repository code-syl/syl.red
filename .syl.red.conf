# Based on: https://ssl-config.mozilla.org/#server=nginx&version=1.27.3&config=modern&openssl=3.4.0&guideline=5.7
#
# Shared TLS, PHP, dotfile blocking, security headers and the AI block list
# live in /etc/nginx/snippets/syl.red-common.conf so each site only holds
# what is actually different about it.

# =========================
# HTTP -> HTTPS (all hostnames)
# =========================
server {
	listen 80;
	server_name syl.red www.syl.red notes.syl.red swc.syl.red cute.syl.red;

	return 301 https://$host$request_uri;
}

# =========================
# Main website
# =========================
server {
	listen 443 ssl;
	http2 on;
	server_name syl.red www.syl.red;

	root /var/www/html/syl.red;
	index index.php index.html;

	access_log /var/log/nginx/syl.red.log;
	error_log  /var/log/nginx/syl.red-error.log error;

	# /nav/notes -> notes.syl.red
	location = /nav/notes {
		return 301 https://notes.syl.red/$is_args$args;
	}
	location ^~ /nav/notes/ {
		rewrite ^/nav/notes/(.*)$ https://notes.syl.red/$1 permanent;
	}

	# /nav/swc -> swc.syl.red
	location = /nav/swc {
		return 301 https://swc.syl.red/$is_args$args;
	}
	location ^~ /nav/swc/ {
		rewrite ^/nav/swc/(.*)$ https://swc.syl.red/$1 permanent;
	}

	# /nav/cute -> cute.syl.red
	location = /nav/cute {
		return 301 https://cute.syl.red/$is_args$args;
	}
	location ^~ /nav/cute/ {
		rewrite ^/nav/cute/(.*)$ https://cute.syl.red/$1 permanent;
	}

	include /etc/nginx/snippets/syl.red-common.conf;
}

# =========================
# Notes subdomain
# =========================
server {
	listen 443 ssl;
	http2 on;
	server_name notes.syl.red;

	root /var/www/html/syl.red/nav/notes;
	index index.php index.html;

	access_log /var/log/nginx/notes.syl.red.log;
	error_log  /var/log/nginx/notes.syl.red-error.log error;

	include /etc/nginx/snippets/syl.red-common.conf;
}

# =========================
# SWC subdomain
# =========================
server {
	listen 443 ssl;
	http2 on;
	server_name swc.syl.red;

	root /var/www/html/syl.red/nav/swc;
	index index.php index.html;

	access_log /var/log/nginx/swc.syl.red.log;
	error_log  /var/log/nginx/swc.syl.red-error.log error;

	# The SWC banner images live in the main site's /assets folder.
	# Serve them here too so they stay same-origin (CSP img-src 'self').
	location /assets/ {
		root /var/www/html/syl.red;
	}

	include /etc/nginx/snippets/syl.red-common.conf;
}
# =========================
# Cute subdomain
# =========================
server {
	listen 443 ssl;
	http2 on;
	server_name cute.syl.red;

	root /var/www/html/syl.red/nav/cute/public;
	index index.php;

	access_log /var/log/nginx/cute.syl.red.log;
	error_log  /var/log/nginx/cute.syl.red-error.log error;

	# Backup restores can be a few MB after years of logging.
	client_max_body_size 25m;

	# Fonts/images/css/js. `expires` (not add_header) so the shared security
	# headers from the common snippet are still inherited here.
	location /assets/ {
		expires 30d;
		access_log off;
		try_files $uri =404;
	}

	# Exact-match locations win over the snippet's regex/prefix locations.
	# The login gets an nginx-level throttle on top of the app's own lockout.
	location = /api/login {
		limit_req zone=cute_login burst=5 nodelay;
		limit_req_status 429;
		include fastcgi_params;
		fastcgi_param SCRIPT_FILENAME $document_root/index.php;
		fastcgi_param SCRIPT_NAME /index.php;
		fastcgi_pass unix:/var/run/php/php-fpm.sock;
	}

	# Everything else (app shell + /api/...) falls through the snippet's
	# `try_files $uri $uri/ /index.php$is_args$args` to public/index.php.
	include /etc/nginx/snippets/syl.red-common.conf;
}
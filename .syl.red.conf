# Based on: https://ssl-config.mozilla.org/#server=nginx&version=1.27.3&config=modern&openssl=3.4.0&guideline=5.7
#
# Shared TLS, PHP, dotfile blocking, security headers and the AI block list
# live in /etc/nginx/snippets/syl.red-common.conf so each site only holds
# what is actually different about it.

# =========================
# HTTP -> HTTPS (all hostnames)
# =========================
server {
	listen 80;
	server_name syl.red www.syl.red notes.syl.red swc.syl.red;

	return 301 https://$host$request_uri;
}

# =========================
# Main website
# =========================
server {
	listen 443 ssl;
	http2 on;
	server_name syl.red www.syl.red;

	root /var/www/html/syl.red;
	index index.php index.html;

	access_log /var/log/nginx/syl.red.log;
	error_log  /var/log/nginx/syl.red-error.log error;

	# /nav/notes -> notes.syl.red
	location = /nav/notes {
		return 301 https://notes.syl.red/$is_args$args;
	}
	location ^~ /nav/notes/ {
		rewrite ^/nav/notes/(.*)$ https://notes.syl.red/$1 permanent;
	}

	# /nav/swc -> swc.syl.red
	location = /nav/swc {
		return 301 https://swc.syl.red/$is_args$args;
	}
	location ^~ /nav/swc/ {
		rewrite ^/nav/swc/(.*)$ https://swc.syl.red/$1 permanent;
	}

	include /etc/nginx/snippets/syl.red-common.conf;
}

# =========================
# Notes subdomain
# =========================
server {
	listen 443 ssl;
	http2 on;
	server_name notes.syl.red;

	root /var/www/html/syl.red/nav/notes;
	index index.php index.html;

	access_log /var/log/nginx/notes.syl.red.log;
	error_log  /var/log/nginx/notes.syl.red-error.log error;

	include /etc/nginx/snippets/syl.red-common.conf;
}

# =========================
# SWC subdomain
# =========================
server {
	listen 443 ssl;
	http2 on;
	server_name swc.syl.red;

	root /var/www/html/syl.red/nav/swc;
	index index.php index.html;

	access_log /var/log/nginx/swc.syl.red.log;
	error_log  /var/log/nginx/swc.syl.red-error.log error;

	# The SWC banner images live in the main site's /assets folder.
	# Serve them here too so they stay same-origin (CSP img-src 'self').
	location /assets/ {
		root /var/www/html/syl.red;
	}

	include /etc/nginx/snippets/syl.red-common.conf;
}
